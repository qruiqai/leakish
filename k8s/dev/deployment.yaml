apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: leakish-detect
    component: web
  name: leakish-web
  namespace: leakish-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: leakish-detect
      component: web
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: leakish-detect
        component: web
    spec:
      containers:
        - name: web
          image: sgccr.ccs.tencentyun.com/<your-org>/leakish-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '3000'
            - name: HOSTNAME
              value: 0.0.0.0
            - name: NEXT_TELEMETRY_DISABLED
              value: '1'
          envFrom:
            - secretRef:
                name: leakish-secrets
          resources:
            limits:
              cpu: '500m'
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              # /api/health/ready adds a DB ping; a stalled pool pulls the
              # pod out of the service rotation without killing it.
              path: /api/health/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
      imagePullSecrets:
        - name: regcred
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
