# Hourly backstop for missed Stripe webhooks. Re-syncs any Subscription row
# whose `currentPeriodEnd` is in the past (and status is still paid) by
# re-fetching from Stripe via `scripts/reconcile-subscriptions.ts`. See
# README §"Subscription reconcile cron" for the rationale.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: leakish-reconcile-subscriptions
  namespace: leakish-dev
  labels:
    app: leakish-detect
    component: reconcile-subscriptions
spec:
  schedule: '0 * * * *'           # every hour, on the hour, UTC
  concurrencyPolicy: Forbid       # if the previous run is still going, skip
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 1             # one in-job retry; CronJob fires again next hour
      activeDeadlineSeconds: 600  # 10 min hard cap per run
      template:
        metadata:
          labels:
            app: leakish-detect
            component: reconcile-subscriptions
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: regcred
          containers:
            - name: reconcile
              image: sgccr.ccs.tencentyun.com/<your-org>/leakish-web:latest
              imagePullPolicy: Always
              command: ['yarn', 'reconcile-subscriptions']
              env:
                - name: NODE_ENV
                  value: production
                - name: NEXT_TELEMETRY_DISABLED
                  value: '1'
                # Optional override: tune the per-run batch cap. Default is 100.
                # - name: RECONCILE_LIMIT
                #   value: '100'
              envFrom:
                - secretRef:
                    name: leakish-secrets
              resources:
                limits:
                  cpu: '500m'
                  memory: 256Mi
                requests:
                  cpu: 50m
                  memory: 64Mi
