apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: leakish-ingress
  namespace: leakish-dev
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    nginx.ingress.kubernetes.io/proxy-connect-timeout: '60'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/ssl-redirect: 'false'
spec:
  ingressClassName: nginx
  rules:
    - host: leakish.com
      http:
        paths:
          - backend:
              service:
                name: leakish-web
                port:
                  number: 80
            path: /
            pathType: Prefix
    - host: www.leakish.com
      http:
        paths:
          - backend:
              service:
                name: leakish-web
                port:
                  number: 80
            path: /
            pathType: Prefix
    - host: detect.<your-org>.app
      http:
        paths:
          - backend:
              service:
                name: leakish-web
                port:
                  number: 80
            path: /
            pathType: Prefix
