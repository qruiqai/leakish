name: Deploy to TKE

on:
  push:
    tags:
      - 'v*'
      - 'dev-tag/v*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Version tag to deploy'
        required: false
        default: 'latest'

env:
  TCR_REGISTRY: sgccr.ccs.tencentyun.com
  TCR_NAMESPACE: <your-org>
  IMAGE_NAME: detect-web

jobs:
  # Diagnostic only — runs unconditionally so we can see what context the
  # runner actually sees. Remove once the deploy trigger is reliable.
  ctx-debug:
    name: ctx debug
    runs-on: ubuntu-latest
    steps:
      - name: Echo context
        run: |
          echo "event_name = ${{ github.event_name }}"
          echo "ref        = ${{ github.ref }}"
          echo "ref_name   = ${{ github.ref_name }}"
          echo "ref_type   = ${{ github.ref_type }}"
          echo "sha        = ${{ github.sha }}"
          echo "head_ref   = ${{ github.head_ref }}"
          echo "base_ref   = ${{ github.base_ref }}"
          echo "startsWith(ref_name, 'dev-tag/') = ${{ startsWith(github.ref_name, 'dev-tag/') }}"
          echo "startsWith(ref, 'refs/tags/dev-tag/') = ${{ startsWith(github.ref, 'refs/tags/dev-tag/') }}"

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma Client
        run: yarn prisma:generate

      - name: Lint
        run: yarn lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: yarn test

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to TCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Extract metadata
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/dev-tag/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/dev-tag/}
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          elif [[ "${{ github.ref }}" == refs/heads/main ]]; then
            VERSION=latest
          elif [[ "${{ github.ref }}" == refs/heads/develop ]]; then
            VERSION=dev-$(date +%Y%m%d)-${GITHUB_SHA::8}
          else
            VERSION=${GITHUB_SHA::8}
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tags=${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${VERSION}" >> $GITHUB_OUTPUT

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}
          cache-to: type=gha,mode=min,scope=${{ env.IMAGE_NAME }}
          platforms: linux/amd64

  deploy:
    name: Deploy to leakish-dev
    runs-on: ubuntu-latest
    needs: [build]
    # Trigger:
    # - Tag push whose short ref begins with `dev-tag/` (standard release path)
    # - workflow_dispatch (manual trigger from UI / API)
    #
    # `always() &&` is REQUIRED here. The `test` job is gated on
    # `pull_request` events and is skipped on tag pushes; without `always()`,
    # GitHub Actions transitively propagates that skip through `build`
    # (which uses `if: always() && ...` to run anyway) all the way to here,
    # silently skipping `deploy`. That was the long-standing bug — the
    # build artifact gets pushed to TCR but the rollout never fires.
    if: always() && needs.build.result == 'success' && ((github.event_name == 'push' && startsWith(github.ref_name, 'dev-tag/')) || github.event_name == 'workflow_dispatch')

    # NOTE: job-level `env:` cannot reference `needs.*.outputs.*` — that
    # context isn't available at job-env evaluation time. So NAMESPACE +
    # IMAGE live as step-level env vars (where `needs` IS available) or
    # inline where used.
    env:
      NAMESPACE: leakish-dev

    steps:
      - name: Debug — what is the runner seeing?
        run: |
          echo "github.ref         = ${{ github.ref }}"
          echo "github.ref_name    = ${{ github.ref_name }}"
          echo "github.ref_type    = ${{ github.ref_type }}"
          echo "github.event_name  = ${{ github.event_name }}"
          echo "image-version      = ${{ needs.build.outputs.image-version }}"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_DEV }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Run Prisma db push
        env:
          IMAGE: ${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image-version }}
          JOB_NAME: detect-prisma-migrate-${{ github.run_id }}
        run: |
          kubectl delete job "$JOB_NAME" -n "$NAMESPACE" --ignore-not-found
          cat <<EOF | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: $JOB_NAME
            namespace: $NAMESPACE
            labels:
              app: leakish-detect
              job: prisma-migrate
          spec:
            backoffLimit: 1
            ttlSecondsAfterFinished: 300
            template:
              metadata:
                labels:
                  app: leakish-detect
                  job: prisma-migrate
              spec:
                restartPolicy: Never
                imagePullSecrets:
                  - name: regcred
                containers:
                  - name: prisma
                    image: $IMAGE
                    command:
                      - sh
                      - -c
                      - |
                        cd /app
                        npx prisma db push --accept-data-loss --schema=./prisma/schema.prisma
                    envFrom:
                      - secretRef:
                          name: leakish-secrets
          EOF
          kubectl wait --for=condition=complete job/$JOB_NAME -n "$NAMESPACE" --timeout=5m || \
            kubectl wait --for=condition=failed job/$JOB_NAME -n "$NAMESPACE" --timeout=10s
          kubectl logs job/$JOB_NAME -n "$NAMESPACE" || true
          if kubectl get job "$JOB_NAME" -n "$NAMESPACE" -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null | grep -q "True"; then
            kubectl delete job "$JOB_NAME" -n "$NAMESPACE" --ignore-not-found --wait=true
            echo "DB push failed"
            exit 1
          fi
          kubectl delete job "$JOB_NAME" -n "$NAMESPACE" --ignore-not-found --wait=true

      - name: Apply manifests
        run: |
          kubectl apply -f k8s/dev/service.yaml -n "$NAMESPACE"
          kubectl apply -f k8s/dev/deployment.yaml -n "$NAMESPACE"
          kubectl apply -f k8s/dev/ingress.yaml -n "$NAMESPACE"

      - name: Roll out web image
        env:
          IMAGE: ${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image-version }}
        run: |
          kubectl set image deployment/leakish-web \
            web=$IMAGE \
            -n "$NAMESPACE"
          kubectl rollout status deployment/leakish-web -n "$NAMESPACE" --timeout=5m

      - name: Health check
        env:
          # Public health-check URL. Set as a GitHub Actions repo variable
          # (Settings → Secrets and variables → Variables). Falls back to a
          # no-op if unset, so forks don't fail this step.
          DEV_HEALTH_URL: ${{ vars.DEV_HEALTH_URL }}
        run: |
          if [ -z "$DEV_HEALTH_URL" ]; then
            echo "DEV_HEALTH_URL not set; skipping external health check."
            exit 0
          fi
          sleep 20
          curl -f "$DEV_HEALTH_URL" || exit 1
